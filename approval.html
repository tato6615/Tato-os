body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b0b0b;
  color: #f5f5f5;
  padding: 20px;
}

.wrap { max-width: 760px; margin: 0 auto; }

.header { margin-bottom: 24px; }

.brand {
  font-size: 13px;
  letter-spacing: 2px;
  color: #ff7a00;
  font-weight: 700;
}

h1 {
  margin: 8px 0 4px;
  font-size: 28px;
}

.sub {
  color: #888;
  font-size: 14px;
}

.card {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

.status {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 8px;
  background: #2b2100;
  color: #ffb000;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .5px;
  margin-bottom: 14px;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 11px 0;
  border-bottom: 1px solid #242424;
}

.row:last-child { border-bottom: 0; }

.label {
  color: #888;
  font-size: 13px;
}

.value {
  text-align: right;
  font-size: 14px;
  max-width: 65%;
  word-break: break-word;
}

.reason {
  margin-top: 16px;
  padding: 14px;
  background: #101010;
  border-radius: 10px;
  color: #ccc;
  line-height: 1.6;
  font-size: 14px;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

button {
  flex: 1;
  border: 0;
  border-radius: 11px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.approve {
  background: #ff7a00;
  color: #111;
}

.reject {
  background: #252525;
  color: #ddd;
  border: 1px solid #3a3a3a;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.message {
  margin-top: 16px;
  padding: 13px;
  border-radius: 10px;
  background: #101010;
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
  display: none;
  white-space: pre-wrap;
  word-break: break-word;
}

.empty {
  color: #888;
  text-align: center;
  padding: 30px 10px;
}

.next {
  margin-top: 16px;
  padding: 14px;
  border-left: 3px solid #ff7a00;
  background: #111;
  color: #bbb;
  font-size: 13px;
  line-height: 1.6;
}

@media (max-width: 600px) {
  body { padding: 14px; }

  h1 { font-size: 24px; }

  .row { display: block; }

  .value {
    text-align: left;
    max-width: 100%;
    margin-top: 5px;
  }

  .actions { flex-direction: column; }
}

  </div>

  <script>
    /*
      TATO OS — APPROVAL CONTROL V1.1

      IMPORTANT:
      This page talks ONLY to:
      /api/approval-engine

      It must NEVER call:
      /api/action-engine
    */

    const API = "/api/approval-engine";

    let currentActionId = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showMessage(message) {
      const box = document.getElementById("message");

      if (!box) return;

      box.style.display = "block";
      box.textContent = message;
    }

    async function loadQueue() {
      const app = document.getElementById("app");

      try {
        const response = await fetch(
          API + "?t=" + Date.now(),
          {
            method: "GET",
            cache: "no-store",
            headers: {
              "Accept": "application/json"
            }
          }
        );

        const data = await response.json();

        if (!data.success) {
          throw new Error(
            data.error || "ไม่สามารถโหลด Approval Queue"
          );
        }

        const actions = data.queue?.actions || [];

        if (!actions.length) {
          app.innerHTML = `
            <div class="card">
              <div class="status">QUEUE EMPTY</div>
              <div class="empty">
                ไม่มี Action ที่รอการอนุมัติ
              </div>
            </div>
          `;
          return;
        }

        const action = actions[0];

        currentActionId = action.id;

        app.innerHTML = `
          <div class="card">

            <div class="status">PENDING APPROVAL</div>

            <div class="row">
              <div class="label">Approval API</div>
              <div class="value">
                /api/approval-engine
              </div>
            </div>

            <div class="row">
              <div class="label">Action ID</div>
              <div class="value">
                ${escapeHtml(action.id)}
              </div>
            </div>

            <div class="row">
              <div class="label">Action</div>
              <div class="value">
                ${escapeHtml(action.action_type)}
              </div>
            </div>

            <div class="row">
              <div class="label">Priority</div>
              <div class="value">
                ${escapeHtml(action.priority)}
              </div>
            </div>

            <div class="row">
              <div class="label">Content ID</div>
              <div class="value">
                ${escapeHtml(action.content_id)}
              </div>
            </div>

            <div class="row">
              <div class="label">Measurement ID</div>
              <div class="value">
                ${escapeHtml(action.measurement_id)}
              </div>
            </div>

            <div class="row">
              <div class="label">Requires Approval</div>
              <div class="value">
                ${action.requires_approval ? "YES" : "NO"}
              </div>
            </div>

            <div class="reason">
              <strong>เหตุผลจาก Decision Layer</strong><br>
              ${escapeHtml(action.reason)}
            </div>

            <div class="actions">

              <button
                class="approve"
                id="approveBtn"
                onclick="submitApproval('APPROVE')">
                ✓ APPROVE
              </button>

              <button
                class="reject"
                id="rejectBtn"
                onclick="submitApproval('REJECT')">
                REJECT
              </button>

            </div>

            <div id="message" class="message"></div>

          </div>
        `;

      } catch (error) {

        app.innerHTML = `
          <div class="card">
            <div class="status">ERROR</div>
            <div class="reason">
              ${escapeHtml(error.message)}
            </div>
          </div>
        `;

      }
    }

    async function submitApproval(decision) {

      if (!currentActionId) {
        showMessage("ไม่พบ Action ID");
        return;
      }

      const approveBtn =
        document.getElementById("approveBtn");

      const rejectBtn =
        document.getElementById("rejectBtn");

      if (approveBtn) approveBtn.disabled = true;
      if (rejectBtn) rejectBtn.disabled = true;

      showMessage(
        decision === "APPROVE"
          ? "กำลังอนุมัติ Action..."
          : "กำลังปฏิเสธ Action..."
      );

      try {

        /*
          CRITICAL:
          Approval POST goes ONLY to approval-engine.
        */

        const response = await fetch(
          API +
          "?action_run_id=" +
          encodeURIComponent(currentActionId),
          {
            method: "POST",
            cache: "no-store",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              decision: decision
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error ||
            data.status ||
            "Approval request failed"
          );
        }

        /*
          APPROVED
        */

        if (data.status === "APPROVED") {

          document.getElementById("app").innerHTML = `
            <div class="card">

              <div class="status">
                APPROVED
              </div>

              <div class="row">
                <div class="label">Layer</div>
                <div class="value">
                  ${escapeHtml(data.layer || "APPROVAL_ENGINE_V1")}
                </div>
              </div>

              <div class="row">
                <div class="label">Action ID</div>
                <div class="value">
                  ${escapeHtml(currentActionId)}
                </div>
              </div>
