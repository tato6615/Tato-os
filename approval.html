<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TATO OS — Approval Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #0b0d10;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .sub {
      color: #8f96a3;
      margin-bottom: 24px;
    }

    .status {
      padding: 14px 16px;
      border: 1px solid #252a33;
      border-radius: 12px;
      background: #11151b;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .card {
      background: #11151b;
      border: 1px solid #252a33;
      border-radius: 16px;
      padding: 20px;
    }

    .empty {
      color: #8f96a3;
      text-align: center;
      padding: 40px 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #20242c;
    }

    .label {
      color: #8f96a3;
    }

    .value {
      word-break: break-word;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      flex: 1;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .approve {
      background: #f28c28;
      color: #111;
    }

    .reject {
      background: #242a33;
      color: #fff;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #080a0d;
      padding: 14px;
      border-radius: 10px;
      color: #b9c0cc;
      font-size: 12px;
      overflow: auto;
    }

    .ok {
      color: #72e6a1;
    }

    .error {
      color: #ff7474;
    }

    .small {
      font-size: 12px;
      color: #707784;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>TATO OS — Approval Control</h1>
    <div class="sub">
      Human Approval Gate
    </div>

    <div id="status" class="status">
      กำลังโหลด Approval Queue...
    </div>

    <div class="card">

      <div id="queue">
        <div class="empty">
          กำลังโหลดรายการ...
        </div>
      </div>

      <div id="result"></div>

    </div>

  </div>

  <script>
    const API = "/api/approval-engine";

    let currentActionId = null;
    let loading = false;

    const statusEl = document.getElementById("status");
    const queueEl = document.getElementById("queue");
    const resultEl = document.getElementById("result");

    function setStatus(message, type = "") {
      statusEl.className = "status " + type;
      statusEl.textContent = message;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
      const controller = new AbortController();

      const timeout = setTimeout(() => {
        controller.abort();
      }, timeoutMs);

      try {
        return await fetch(url, {
          ...options,
          signal: controller.signal,
          cache: "no-store"
        });
      } finally {
        clearTimeout(timeout);
      }
    }

    async function loadQueue() {

      if (loading) return;

      loading = true;

      currentActionId = null;
      resultEl.innerHTML = "";

      queueEl.innerHTML = `
        <div class="empty">
          กำลังโหลดรายการ...
        </div>
      `;

      setStatus("กำลังเชื่อมต่อ Approval Engine...");

      try {

        const response = await fetchWithTimeout(
          API + "?t=" + Date.now(),
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            }
          },
          8000
        );

        const raw = await response.text();

        let data;

        try {
          data = JSON.parse(raw);
        } catch (e) {
          throw new Error(
            "API ส่งข้อมูลที่ไม่ใช่ JSON: " + raw.slice(0, 300)
          );
        }

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status + ": " +
            (data.error || data.message || "Approval API error")
          );
        }

        if (!data.success) {
          throw new Error(
            data.error || data.message || "Approval Engine ไม่สำเร็จ"
          );
        }

        const actions =
          data.queue &&
          Array.isArray(data.queue.actions)
            ? data.queue.actions
            : [];

        if (actions.length === 0) {

          setStatus(
            "Approval Queue ว่าง — ไม่มี Action ที่รออนุมัติ",
            "ok"
          );

          queueEl.innerHTML = `
            <div class="empty">
              ไม่มีรายการรอ Approval
            </div>
          `;

          return;
        }

        const action = actions[0];

        currentActionId = action.id;

        setStatus(
          "พบ Action ที่รอ Approval — " + action.id
        );

        queueEl.innerHTML = `
          <div class="row">
            <div class="label">Action ID</div>
            <div class="value">${escapeHtml(action.id)}</div>
          </div>

          <div class="row">
            <div class="label">Action Type</div>
            <div class="value">${escapeHtml(action.action_type)}</div>
          </div>

          <div class="row">
            <div class="label">Status</div>
            <div class="value">${escapeHtml(action.status)}</div>
          </div>

          <div class="row">
            <div class="label">Action Status</div>
            <div class="value">${escapeHtml(action.action_status)}</div>
          </div>

          <div class="row">
            <div class="label">Priority</div>
            <div class="value">${escapeHtml(action.priority)}</div>
          </div>

          <div class="row">
            <div class="label">Reason</div>
            <div class="value">${escapeHtml(action.reason)}</div>
          </div>

          <div class="row">
            <div class="label">Content ID</div>
            <div class="value">${escapeHtml(action.content_id)}</div>
          </div>

          <div class="row">
            <div class="label">Measurement ID</div>
            <div class="value">${escapeHtml(action.measurement_id)}</div>
          </div>

          <div class="buttons">
            <button
              id="approveBtn"
              class="approve"
              onclick="submitApproval('APPROVE')">
              APPROVE
            </button>

            <button
              id="rejectBtn"
              class="reject"
              onclick="submitApproval('REJECT')">
              REJECT
            </button>
          </div>

          <div class="small">
            Approval API: /api/approval-engine
          </div>
        `;

      } catch (error) {

        console.error(error);

        const message =
          error && error.name === "AbortError"
            ? "เชื่อมต่อ Approval API นานเกิน 8 วินาที"
            : (error.message || String(error));

        setStatus(
          "โหลด Approval Queue ไม่สำเร็จ: " + message,
          "error"
        );

        queueEl.innerHTML = `
          <div class="empty error">
            ${escapeHtml(message)}
            <br><br>
            <button
              class="reject"
              onclick="loadQueue()"
              style="max-width:220px;">
              ลองใหม่
            </button>
          </div>
        `;

      } finally {
        loading = false;
      }
    }

    async function submitApproval(decision) {

      if (!currentActionId) {
        setStatus(
          "ยังไม่มี Action สำหรับ Approval",
          "error"
        );
        return;
      }

      const approveBtn = document.getElementById("approveBtn");
      const rejectBtn = document.getElementById("rejectBtn");

      if (approveBtn) approveBtn.disabled = true;
      if (rejectBtn) rejectBtn.disabled = true;

      resultEl.innerHTML = "";

      setStatus(
        decision === "APPROVE"
          ? "กำลังอนุมัติ Action..."
          : "กำลังปฏิเสธ Action..."
      );

      try {

        const response = await fetchWithTimeout(
          API + "?action_run_id=" +
          encodeURIComponent(currentActionId) +
          "&t=" + Date.now(),
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              action_run_id: currentActionId,
              decision: decision
            })
          },
          10000
        );

        const raw = await response.text();

        let data;

        try {
          data = JSON.parse(raw);
        } catch (e) {
          throw new Error(
            "Approval API ส่งข้อมูลที่ไม่ใช่ JSON: " +
            raw.slice(0, 300)
          );
        }

        if (!response.ok || !data.success) {
          throw new Error(
            data.error ||
            data.message ||
            ("HTTP " + response.status)
          );
        }

        const finalStatus =
          data.status ||
          (data.action && data.action.status) ||
          "UNKNOWN";

        const layer = data.layer || "UNKNOWN";

        setStatus(
          decision === "APPROVE"
            ? "✓ Approval สำเร็จ"
            : "✓ Action ถูก Reject",
          "ok"
        );

        queueEl.innerHTML = `
          <div class="empty ok">
            ${decision === "APPROVE"
              ? "Action ได้รับการอนุมัติแล้ว"
              : "Action ถูกปฏิเสธแล้ว"}
            <br><br>
            <strong>${escapeHtml(currentActionId)}</strong>
          </div>
        `;

        resultEl.innerHTML = `
          <pre>${escapeHtml(JSON.stringify({
            success: data.success,
            layer: layer,
            status: finalStatus,
            action_run_id: currentActionId,
            decision: decision
          }, null, 2))}</pre>
        `;

      } catch (error) {

        console.error(error);

        const message =
          error && error.name === "AbortError"
            ? "Approval API ไม่ตอบภายใน 10 วินาที"
            : (error.message || String(error));

        setStatus(
          "Approval ไม่สำเร็จ: " + message,
          "error"
        );

        if (approveBtn) approveBtn.disabled = false;
        if (rejectBtn) rejectBtn.disabled = false;

        resultEl.innerHTML = `
          <pre class="error">${escapeHtml(message)}</pre>
        `;
      }
    }

    window.addEventListener("load", loadQueue);
  </script>

</body>
</html>
