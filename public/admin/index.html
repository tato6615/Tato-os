<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TATO ออเดอร์</title>
<style>
body{margin:0;background:#141312;color:#e6e1df;font-family:system-ui,-apple-system,"Sarabun",sans-serif}
header{position:sticky;top:0;background:#141312;border-bottom:1px solid #2b2a28;padding:12px 16px;z-index:5}
h1{margin:0 0 8px;font-size:18px}
.tabs button{background:#2b2a28;color:#e6e1df;border:0;border-radius:8px;padding:8px 14px;margin-right:6px;font-size:14px}
.tabs button.on{background:#ff5e1a;color:#390c00;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:#2b2a28;color:#cfc8c4;border:0}
.chip.ok{background:#173a24;color:#7be0a0}.chip.warn{background:#3d2f12;color:#f3c76b}.chip.bad{background:#4a1b17;color:#ff9b91}
button.chip{cursor:pointer}
.banner{display:none;margin:12px 0;padding:14px;border-radius:12px;background:#ff5e1a;color:#390c00;font-weight:700;font-size:16px;text-align:center;cursor:pointer;animation:pulse 1.2s infinite}
.banner.show{display:block}.banner small{display:block;font-weight:400;font-size:12px;margin-top:2px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,94,26,.6)}50%{box-shadow:0 0 0 10px rgba(255,94,26,0)}}
main{padding:12px 16px;max-width:760px;margin:auto}
.sum{background:#1d1b1a;border:1px solid #2b2a28;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.card{background:#1d1b1a;border:1px solid #2b2a28;border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.6}
.card.fresh{border-color:#ff5e1a;box-shadow:0 0 0 1px #ff5e1a}
.row{display:flex;justify-content:space-between;gap:12px}.row span:last-child{text-align:right}
.no{color:#ff5e1a;font-weight:700}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#3a2a20}
.tag.paid{background:#173a24;color:#7be0a0}.tag.new{background:#ff5e1a;color:#390c00;font-weight:700;margin-right:6px}
.ok-btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#ff5e1a;color:#390c00;font-weight:700;font-size:15px}
.dim{color:#a39a95}a{color:#f3bc8b}
.tag.bad{background:#4a1b17;color:#ff9b91}.tag.warn{background:#3d2f12;color:#f3c76b}.tag.test{background:#2b2a28;color:#a39a95}
.sec{margin-top:10px;padding-top:10px;border-top:1px solid #2b2a28}
.btn2{padding:10px 12px;border:0;border-radius:10px;background:#2b2a28;color:#e6e1df;font-size:14px;cursor:pointer}
.btn2.danger{background:#4a1b17;color:#ff9b91}.inline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input,select{background:#141312;color:#e6e1df;border:1px solid #2b2a28;border-radius:8px;padding:9px;font-size:14px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:6px 4px;border-bottom:1px solid #2b2a28}th:first-child,td:first-child{text-align:left}
.wrap{overflow-x:auto}
</style></head><body>
<header><h1>TATO ออเดอร์</h1>
<div class="tabs"><button data-f="pending" class="on" id="tPend">รอชำระ</button><button data-f="paid" id="tPaid">จ่ายแล้ว / ส่งของ</button><button data-f="all">ทั้งหมด</button><button data-f="report">รายงาน</button><button data-f="config">ตั้งค่า</button></div>
<div class="bar"><span class="chip" id="cConn">กำลังเชื่อมต่อ…</span><button class="chip" id="cSound" type="button">🔊 เสียง: เปิด</button><span class="chip" id="cNotify" style="display:none"></span></div>
<div class="dim" id="cFeat" style="font-size:12px;margin-top:6px"></div>
</header>
<main><div class="banner" id="banner" role="alert"></div><div id="sum"></div><div id="list"></div></main>
<script>
var all=[],filter="pending",failCount=0,newIds=[],lastBeep=0,ac=null,notifyCfg=null;
var soundOn=true;try{soundOn=localStorage.getItem("tato_sound")!=="off"}catch(e){}
function money(n){return Number(n||0).toLocaleString("th-TH")}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function row(k,v){var r=el("div","row");r.appendChild(el("span","dim",k));r.appendChild(el("span",null,v));return r}
function $(id){return document.getElementById(id)}
async function api(u,o){var r=await fetch(u,Object.assign({cache:"no-store"},o||{}));var j=await r.json().catch(function(){return{}});if(!r.ok||j.success===false)throw new Error(j.status||j.error||("HTTP "+r.status));return j}

/* ---- seen / new-order detection ---- */
function getSeen(){try{var s=localStorage.getItem("tato_seen");return s?JSON.parse(s):null}catch(e){return null}}
function setSeen(a){try{localStorage.setItem("tato_seen",JSON.stringify(a.slice(-500)))}catch(e){}}
function detect(){
  var seen=getSeen(),ids=all.map(function(o){return o.id});
  if(seen===null){setSeen(ids);return}            /* first visit: do not alarm on old orders */
  var added=ids.filter(function(id){return seen.indexOf(id)<0&&newIds.indexOf(id)<0});
  if(added.length){newIds=newIds.concat(added);alarm()}
}
function ack(){setSeen(all.map(function(o){return o.id}));newIds=[];filter="pending";syncTabs();render()}

/* ---- alarm: sound + vibrate + banner + title ---- */
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
document.addEventListener("pointerdown",unlock);
function beep(){
  lastBeep=Date.now();
  if(navigator.vibrate){try{navigator.vibrate([300,150,300])}catch(e){}}
  if(!soundOn||!ac)return;
  try{[0,.35,.7].forEach(function(t){var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.2)})}catch(e){}
}
function alarm(){beep()}
function renderSound(){$("cSound").textContent=soundOn?"🔊 เสียง: เปิด":"🔇 เสียง: ปิด";$("cSound").className="chip"+(soundOn?" ok":"")}
$("cSound").onclick=function(){soundOn=!soundOn;try{localStorage.setItem("tato_sound",soundOn?"on":"off")}catch(e){}unlock();renderSound();if(soundOn)beep()};
renderSound();
var blink=false;
setInterval(function(){
  var pend=all.filter(function(o){return o.status==="pending"}).length,base=(pend?"("+pend+") ":"")+"TATO ออเดอร์";
  if(newIds.length){blink=!blink;document.title=blink?("🔔 ออเดอร์ใหม่ "+newIds.length):base;if(Date.now()-lastBeep>20000)beep()}
  else document.title=base;
},1000);

/* ---- render ---- */
function syncTabs(){document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x.dataset.f===filter)})}
function setConn(ok,msg){var c=$("cConn");if(ok){c.className="chip ok";c.textContent="🟢 เชื่อมต่อ · "+new Date().toLocaleTimeString("th-TH")}else{c.className="chip bad";c.textContent="🔴 เชื่อมต่อไม่ได้"+(failCount>1?" ("+failCount+" ครั้ง)":"")+(msg?" · "+msg:"")}}
function renderNotify(){
  var c=$("cNotify");if(!notifyCfg){c.style.display="none";return}
  var on=[];if(notifyCfg.telegram)on.push("Telegram");if(notifyCfg.line)on.push("LINE");
  c.style.display="";
  if(on.length){c.className="chip ok";c.textContent="📲 แจ้งเตือนมือถือ: "+on.join(" + ")}
  else{c.className="chip warn";c.textContent="⚠️ ยังไม่ได้ตั้งแจ้งเตือนมือถือ (ดูเว็บนี้ไว้)"}
  var f=$("cFeat");if(!f)return;
  var bits=[];bits.push(notifyCfg.turnstile?"Turnstile ✓":"Turnstile ✗ (ยังไม่เปิด กันสแปมด้วยจำกัดคำขอต่อ IP เท่านั้น)");bits.push(notifyCfg.email?"อีเมลลูกค้า ✓":"อีเมลลูกค้า ✗");bits.push(notifyCfg.slip?"ตรวจสลิป ✓":"ตรวจสลิป ✗");
  f.textContent=bits.join(" · ");
}
async function post(u,b){return api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})}
async function confirmPaid(o){
  if(!confirm("ยืนยันว่าเงิน "+money(o.amount)+" บาท จากออเดอร์ "+o.number+" เข้าบัญชีแล้ว?"))return;
  try{await post("/api/business-money",{operation:"confirm_payment",order_id:o.id,external_payment_id:"MANUAL-"+o.id,amount:o.amount,payment_method:o.payment_method||"promptpay"});await load()}catch(e){alert("ไม่สำเร็จ: "+e.message)}
}
async function act(o,action,extra,msg){
  if(msg&&!confirm(msg))return;
  try{await post("/api/admin-orders",Object.assign({action:action,order_id:o.id},extra||{}));await load()}catch(e){alert("ไม่สำเร็จ: "+e.message)}
}
async function checkSlip(o,file){
  if(!file)return;var fd=new FormData();fd.append("order_id",o.id);fd.append("file",file);
  try{var r=await fetch("/api/verify-slip",{method:"POST",body:fd});var j=await r.json().catch(function(){return{}});
    var t={SLIP_OK:"✅ สลิปถูกต้อง ยอดตรง และยังไม่เคยใช้ — กดยืนยันเงินเข้าได้",AMOUNT_MISMATCH:"⚠️ ยอดในสลิปไม่ตรงกับออเดอร์ ("+(j.slip_amount!=null?j.slip_amount:"?")+" ต่อ "+j.expected_amount+")",SLIP_ALREADY_USED:"⛔ สลิปนี้เคยใช้กับออเดอร์อื่นแล้ว",SLIP_NOT_VERIFIED:"⛔ ตรวจสลิปไม่ผ่าน (อาจปลอม/อ่านไม่ได้)",SLIP_VERIFY_NOT_CONFIGURED:"ยังไม่ได้ตั้งค่าบริการตรวจสลิป"}[j.status]||("ผิดพลาด: "+(j.status||j.error||r.status));
    alert(t);await load()}catch(e){alert("ไม่สำเร็จ: "+e.message)}
}
var METHOD={thaipost:"ไปรษณีย์ไทย",kerry:"Kerry",flash:"Flash",jt:"J&T",other:"อื่น ๆ"};
function card(o){
  var fresh=newIds.indexOf(o.id)>=0,c=el("div","card"+(fresh?" fresh":""));
  var h=el("div","row"),left=el("span");
  if(fresh)left.appendChild(el("span","tag new","ใหม่"));
  left.appendChild(el("span","no",o.number));if(o.is_test){var tt=el("span","tag test","ทดสอบ");tt.style.marginLeft="6px";left.appendChild(tt)}
  h.appendChild(left);
  var cls=o.status==="paid"?" paid":o.status==="cancelled"?" bad":"";
  h.appendChild(el("span","tag"+cls,o.fulfillment==="shipped"?"จัดส่งแล้ว":o.status==="paid"?"จ่ายแล้ว":o.status==="cancelled"?"ยกเลิก":"รอชำระ"));c.appendChild(h);
  c.appendChild(row("เวลา",new Date(o.created_at).toLocaleString("th-TH")));
  if(o.status==="pending"&&o.expires_in_hours!=null){var w=el("div","row");w.appendChild(el("span","dim","ค้างชำระ"));w.appendChild(el("span","tag"+(o.expires_in_hours<24?" warn":""),Math.round(o.age_hours)+" ชม. · ยกเลิกอัตโนมัติใน "+o.expires_in_hours+" ชม."));c.appendChild(w)}
  if(o.status==="cancelled"&&o.cancel_reason)c.appendChild(row("เหตุผลยกเลิก",o.cancel_reason==="expired_unpaid"?"ไม่ชำระใน 48 ชม.":o.cancel_reason==="cancelled_by_admin"?"ยกเลิกโดยร้าน":o.cancel_reason));
  c.appendChild(row("ผู้รับ",o.name));
  var pr=el("div","row");pr.appendChild(el("span","dim","เบอร์"));var a=el("a",null,o.phone);a.href="tel:"+o.phone;var sp=el("span");sp.appendChild(a);pr.appendChild(sp);c.appendChild(pr);
  if(o.email)c.appendChild(row("อีเมล",o.email));
  c.appendChild(row("ที่อยู่",(o.address||"(ไม่มีข้อมูล)")+(o.postal?" "+o.postal:"")));
  c.appendChild(row("คั่ว / บด",(o.roast||"-")+" / "+(o.grind||"-")));
  c.appendChild(row("ปริมาณ",o.kg+" กก."));
  if(o.note)c.appendChild(row("หมายเหตุ",o.note));
  if(o.discount)c.appendChild(row("ส่วนลด",money(o.discount)+" บาท ("+o.discount_code+")"));
  c.appendChild(row("ค่าส่ง",o.shipping?money(o.shipping)+" บาท":"ฟรี"));
  c.appendChild(row("ยอด",money(o.amount)+" บาท"));
  if(o.utm_source)c.appendChild(row("ช่องทาง",o.utm_source));
  if(o.slip_result)c.appendChild(row("ผลตรวจสลิป",o.slip_result));
  if(o.status==="pending"){
    var bt=el("button","ok-btn","ยืนยันว่าเงินเข้าแล้ว");bt.onclick=function(){confirmPaid(o)};c.appendChild(bt);
    var ib=el("div","inline");
    if(notifyCfg&&notifyCfg.slip){var lab=el("label","btn2","📎 ตรวจสลิป");var fi=el("input");fi.type="file";fi.accept="image/*";fi.style.display="none";fi.onchange=function(){checkSlip(o,fi.files[0])};lab.appendChild(fi);ib.appendChild(lab)}
    var cb=el("button","btn2 danger","ยกเลิกออเดอร์");cb.onclick=function(){act(o,"cancel",null,"ยกเลิกออเดอร์ "+o.number+"?")};ib.appendChild(cb);c.appendChild(ib);
  }
  if(o.status==="cancelled"){var rb=el("button","btn2","เปิดออเดอร์กลับ (เริ่มนับ 48 ชม. ใหม่)");rb.style.marginTop="8px";rb.onclick=function(){act(o,"reopen",null,"เปิดออเดอร์ "+o.number+" กลับ?")};c.appendChild(rb)}
  if(o.status==="paid"){
    var sec=el("div","sec");
    if(o.fulfillment==="shipped"){sec.appendChild(row("ขนส่ง",METHOD[o.courier]||o.courier));sec.appendChild(row("เลขพัสดุ",o.tracking_no));sec.appendChild(row("ส่งเมื่อ",new Date(o.shipped_at).toLocaleString("th-TH")))}
    else{
      sec.appendChild(el("div","dim","ใส่เลขพัสดุเมื่อส่งของ (ลูกค้าจะเห็นที่ลิงก์สถานะ)"));
      var f=el("div","inline"),sel=el("select");Object.keys(METHOD).forEach(function(k){var op=el("option",null,METHOD[k]);op.value=k;sel.appendChild(op)});
      var ti=el("input");ti.placeholder="เลขพัสดุ";ti.autocapitalize="characters";
      var sb=el("button","btn2","บันทึกเลขพัสดุ");sb.onclick=function(){if(!ti.value.trim()){alert("กรอกเลขพัสดุ");return}act(o,"set_tracking",{tracking_no:ti.value,courier:sel.value})};
      f.appendChild(sel);f.appendChild(ti);f.appendChild(sb);sec.appendChild(f);
    }
    c.appendChild(sec);
  }
  return c;
}
function chrome(){
  var paid=all.filter(function(o){return o.status==="paid"}),pend=all.filter(function(o){return o.status==="pending"});
  var toShip=paid.filter(function(o){return o.fulfillment!=="shipped"});
  $("tPend").textContent="รอชำระ"+(pend.length?" ("+pend.length+")":"");
  $("tPaid").textContent="จ่ายแล้ว / ส่งของ"+(toShip.length?" (รอส่ง "+toShip.length+")":"");
  var b=$("banner");
  if(newIds.length){b.textContent="🔔 มีออเดอร์ใหม่ "+newIds.length+" รายการ";var sm=el("small",null,"แตะเพื่อรับทราบ");b.appendChild(sm);b.classList.add("show")}else b.classList.remove("show");
}
function render(){
  var real=all.filter(function(o){return !o.is_test});
  chrome();
  var l=$("list"),s2=$("sum");l.textContent="";s2.textContent="";s2.className="";
  if(filter==="report"){renderReport(l);return}
  if(filter==="config"){renderConfig(l);return}
  var qq=real.filter(function(o){return o.status==="paid"&&o.fulfillment!=="shipped"}),by={};qq.forEach(function(o){var k=(o.roast||"?")+" / "+(o.grind||"?");by[k]=(by[k]||0)+o.kg});
  s2.className="sum";
  var rp=real.filter(function(o){return o.status==="paid"});
  s2.appendChild(el("div",null,"(ไม่รวมออเดอร์ทดสอบ) รอชำระ "+real.filter(function(o){return o.status==="pending"}).length+" · จ่ายแล้ว "+rp.length+" ออเดอร์ ("+money(rp.reduce(function(a,o){return a+o.amount},0))+" บาท) · รอส่ง "+qq.length));
  Object.keys(by).forEach(function(k){s2.appendChild(el("div","dim","คิวคั่ว/ส่ง: "+k+" = "+by[k]+" กก.")) });
  var items=all.filter(function(o){return filter==="all"||(filter==="paid"?o.status==="paid":o.status==="pending")});
  if(!items.length)l.appendChild(el("p","dim","ไม่มีออเดอร์"));
  items.forEach(function(o){l.appendChild(card(o))});
}

/* ---- report tab ---- */
var rep={from:"",to:"",data:null,err:""};
function iso(d){return d.toISOString().slice(0,10)}
function renderReport(l){
  if(!rep.from){var t=new Date();rep.to=iso(t);t.setDate(t.getDate()-30);rep.from=iso(t)}
  var c=el("div","card");c.appendChild(el("h3",null,"ยอดขายแยกช่องทาง (UTM) — เฉพาะออเดอร์จริง ไม่รวมทดสอบและที่ยกเลิก"));
  var f=el("div","inline"),a=el("input"),b=el("input");a.type="date";b.type="date";a.value=rep.from;b.value=rep.to;
  var go=el("button","btn2","ดูรายงาน");go.onclick=function(){rep.from=a.value;rep.to=b.value;loadReport()};
  f.appendChild(a);f.appendChild(b);f.appendChild(go);c.appendChild(f);
  if(rep.err)c.appendChild(el("p","dim",rep.err));
  if(rep.data){
    var w=el("div","wrap"),tb=el("table"),hd=el("tr");["ช่องทาง","สั่ง","จ่ายแล้ว","% จ่าย","รายได้","กก.","ค้างจ่าย"].forEach(function(x){hd.appendChild(el("th",null,x))});tb.appendChild(hd);
    rep.data.rows.forEach(function(r){var tr=el("tr");[r.source+(r.medium?" / "+r.medium:"")+(r.campaign?" / "+r.campaign:""),r.orders,r.paid_orders,r.paid_rate_pct+"%",money(r.revenue),r.kg,money(r.pending_amount)].forEach(function(x){tr.appendChild(el("td",null,x))});tb.appendChild(tr)});
    var t=rep.data.total,tr2=el("tr");["รวม",t.orders,t.paid_orders,t.orders?Math.round(t.paid_orders/t.orders*1000)/10+"%":"0%",money(t.revenue),t.kg,money(t.pending_amount)].forEach(function(x){var td=el("td",null,x);td.style.fontWeight="700";tr2.appendChild(td)});tb.appendChild(tr2);
    w.appendChild(tb);c.appendChild(w);
    if(!rep.data.rows.length)c.appendChild(el("p","dim","ยังไม่มีออเดอร์จริงในช่วงนี้"));
  }
  l.appendChild(c);if(!rep.data&&!rep.err)loadReport();
}
async function loadReport(){try{rep.err="";rep.data=await api("/api/sales-report?from="+rep.from+"&to="+rep.to)}catch(e){rep.err="โหลดรายงานไม่สำเร็จ: "+e.message}if(filter==="report")render()}

/* ---- config tab: roast capacity + discount codes ---- */
var cfgData=null,cfgErr="";
async function loadConfig(){try{cfgErr="";cfgData=await api("/api/admin-config")}catch(e){cfgErr="โหลดตั้งค่าไม่สำเร็จ: "+e.message}if(filter==="config")render()}
function renderConfig(l){
  if(!cfgData&&!cfgErr){loadConfig();l.appendChild(el("p","dim","กำลังโหลด…"));return}
  if(cfgErr){l.appendChild(el("p","dim",cfgErr));return}
  var cap=el("div","card");cap.appendChild(el("h3",null,"จำกัดกำลังคั่ว"));
  var cp=cfgData.capacity;cap.appendChild(el("p","dim",cp.limited?("รับรวมได้ "+cp.max+" กก. (ออเดอร์ที่ยังไม่ส่ง ไม่รวมทดสอบ) ใช้แล้ว "+cp.used+" เหลือ "+cp.left+" กก."):"ยังไม่จำกัด (เว้นว่าง = ไม่จำกัด)"));
  var f=el("div","inline"),ci=el("input");ci.type="number";ci.min="0";ci.step="0.5";ci.placeholder="กก. สูงสุด";ci.value=cp.limited?cp.max:"";
  var sv=el("button","btn2","บันทึก");sv.onclick=async function(){try{await post("/api/admin-config",{action:"set_setting",key:"max_open_kg",value:ci.value});await loadConfig()}catch(e){alert("ไม่สำเร็จ: "+e.message)}};
  f.appendChild(ci);f.appendChild(sv);cap.appendChild(f);l.appendChild(cap);
  var dc=el("div","card");dc.appendChild(el("h3",null,"รหัสส่วนลด"));
  var nf=el("div","inline sec"),code=el("input"),type=el("select"),val=el("input"),mk=el("input"),mu=el("input"),ex=el("input");
  cfgData.codes.forEach(function(k){
